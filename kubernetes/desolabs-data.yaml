# ============================================================
# DesoLabs Data - Datastore SQLite (porta 5000)
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desolabs-data
  namespace: desolabs
  labels:
    app: desolabs-data
    tier: data
    app.kubernetes.io/part-of: desolabs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desolabs-data
  namespace: desolabs
  labels:
    app: desolabs-data
    tier: data
    app.kubernetes.io/part-of: desolabs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desolabs-data
  template:
    metadata:
      labels:
        app: desolabs-data
        tier: data
    spec:
      serviceAccountName: desolabs-data
      containers:
        - name: desolabs-data
          image: r.deso.tech/dsk/desolabs-data:1.0.0
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: DB_PATH
              value: "/data/desolabs.db"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
            requests:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: desolabs-data
  namespace: desolabs
  labels:
    app: desolabs-data
    tier: data
    app.kubernetes.io/part-of: desolabs
spec:
  selector:
    app: desolabs-data
  ports:
    - protocol: TCP
      port: 5000
      targetPort: http
      name: http
